<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Діти Божі</title>

  <!-- Preconnect до CDN — зменшує затримку DNS/TLS -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net"/>

  <link rel="stylesheet" href="shared.css"/>

  <!--
    defer: скрипти завантажуються паралельно з HTML-парсингом,
    виконуються по порядку після парсингу — не блокують рендер.
    Порядок виконання: react → react-dom → htm → auth.js → app.js
  -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin defer></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin defer></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js" crossorigin defer></script>
  <script src="auth.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Показується поки React не змонтується -->
  <div id="root"><div style="text-align:center;padding:5rem 1rem;color:#6b7a9b;font-family:sans-serif">⏳</div></div>
</body>
</html>
